name: Energie-Kacheln aktualisieren

on:
  schedule:
    # UTC: stündlich von 5 bis 22 Uhr Berliner Zeit (Winter)
    - cron: "20 4-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: energie
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten laden
        run: python scripts/energie.py
      - name: Committen
        run: |
          git config user.name "datax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energie.json
          git diff --cached --quiet && exit 0
          git commit -m "Energie-Kacheln $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*5))
          done
          exit 1
