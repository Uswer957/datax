name: Probe Energie
on:
  push:
    branches: [claude/project-thread-vxlhm0]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_energie.py
      - run: |
          t() { echo "=== $1"; curl -sL --http1.1 -m 25 -D /tmp/h -o /tmp/o "$@"; grep -iE "^HTTP|content-type" /tmp/h; head -c 500 /tmp/o; echo; }
