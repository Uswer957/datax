name: Vorschau-Test (temporär)
on:
  push:
    branches: [claude/project-thread-2pkx91]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Markt-Kurse
        env:
          NUR: markt
        run: python scripts/kacheln.py
      - name: Symboltest
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import kacheln as k, json
          t = ["NVDA","DELL","SAP-DE","IFX-DE","ASML-NL","ASM-NL","MC-FR","NESN-CH","7203-JP","700-HK","0700-HK","AZN-GB","SHEL-GB","ANT","US10Y","DE10Y-DE"]
          q = k.cnbc_raw(t)
          for s in t:
              x = q.get(s) or {}
              print(s, "|", x.get("name"), "|", x.get("last"), x.get("change_pct"), x.get("last_time"), x.get("code"))
          d = json.load(open("kacheln.json"))["markt"]
          for g, l in d["gruppen"].items():
              for e in l: print(g, e["sym"], e["name"], e["px"], e["chg"], e["abs"], len(e["verlauf"]), e["von"], e["zeit"])
          PY
      - name: Committen
        run: |
          git config user.name "datax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kacheln.json
          git diff --cached --quiet && exit 0
          git commit -m "Testlauf Markt-Kurse"
          git push origin "HEAD:${GITHUB_REF_NAME}"
